<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 실패 · LOOM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="/#/" class="logo">LOOM</a>
    </div>
  </header>

  <main class="main">
    <section class="complete">
      <div class="complete__check complete__check--fail" aria-hidden="true">!</div>
      <h1 class="page-title" id="title">결제를 완료하지 못했어요</h1>
      <p class="empty__text" id="message"></p>
      <a class="btn btn--block" href="/#/checkout">다시 결제하기</a>
      <p class="hint"><a href="/#/cart">장바구니로 돌아가기</a></p>
    </section>
  </main>

  <script>
    // 토스페이먼츠 인증 실패/취소 시 이동하는 페이지 (?code=&message=&orderId=)
    const q = new URLSearchParams(location.search);
    const code = q.get("code") || "UNKNOWN";
    if (code === "PAY_PROCESS_CANCELED") {
      document.getElementById("title").textContent = "결제를 취소했어요";
      document.getElementById("message").textContent = "장바구니는 그대로 남아 있어요.";
    } else {
      document.getElementById("message").textContent = `${q.get("message") || "알 수 없는 오류가 발생했습니다."} (${code})`;
    }
  </script>
</body>
</html>
