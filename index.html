<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Splash Arena</title>
  <style>
    :root {
      --bg: #0f1b2d;
      --panel: #16263f;
      --text: #e8f1ff;
      --muted: #8ea6c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    canvas {
      display: block;
      max-width: calc(100vw - 32px);
      height: auto;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      image-rendering: pixelated;
    }
    .help {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }
    kbd {
      background: var(--panel);
      border: 1px solid #2c4366;
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--text);
      font-family: inherit;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="help">
    <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> 이동 ·
    <kbd>Space</kbd> 물풍선 ·
    <kbd>Enter</kbd> 시작/다시 하기 ·
    <kbd>Esc</kbd> 일시정지
  </div>
  <script src="game.js"></script>
</body>
</html>
